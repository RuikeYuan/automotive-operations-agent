[project]
name = "automotive-operations-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "pytest>=8,<10"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

